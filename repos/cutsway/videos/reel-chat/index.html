<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f4f2ec;
      }
    </style>
  </head>
  <body>
    <!-- Cutsway chat reel: a creator texts Cutsway, 30 s. Music: ../../tools/make_music.py chat (half-time). No voice. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="chat" data-composition-id="chat" data-composition-src="compositions/chat.html" data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="music" class="clip" data-start="0" data-duration="30" data-track-index="10" data-volume="0.75" src="assets/audio/music.wav"></audio>

      <!-- Message sounds: a soft send for the creator, a ping for each Cutsway reply -->
      <audio id="sfx-00" class="clip" data-start="1.4" data-duration="0.57" data-track-index="11" data-volume="0.22" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-01" class="clip" data-start="3.6" data-duration="1.32" data-track-index="11" data-volume="0.35" src="assets/sfx/ping.mp3"></audio>
      <audio id="sfx-02" class="clip" data-start="4.8" data-duration="0.57" data-track-index="12" data-volume="0.22" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-03" class="clip" data-start="6.38" data-duration="0.37" data-track-index="11" data-volume="0.45" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-04" class="clip" data-start="7.3" data-duration="1.32" data-track-index="11" data-volume="0.35" src="assets/sfx/ping.mp3"></audio>
      <audio id="sfx-05" class="clip" data-start="8.55" data-duration="0.57" data-track-index="12" data-volume="0.45" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-06" class="clip" data-start="9.2" data-duration="1.32" data-track-index="11" data-volume="0.35" src="assets/sfx/ping.mp3"></audio>
      <audio id="sfx-07" class="clip" data-start="10.8" data-duration="0.57" data-track-index="11" data-volume="0.22" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-08" class="clip" data-start="11.7" data-duration="0.57" data-track-index="11" data-volume="0.22" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-09" class="clip" data-start="13.2" data-duration="1.32" data-track-index="11" data-volume="0.35" src="assets/sfx/ping.mp3"></audio>
      <audio id="sfx-10" class="clip" data-start="15.0" data-duration="0.57" data-track-index="11" data-volume="0.22" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-11" class="clip" data-start="16.7" data-duration="1.32" data-track-index="11" data-volume="0.35" src="assets/sfx/ping.mp3"></audio>
      <audio id="sfx-12" class="clip" data-start="18.4" data-duration="0.57" data-track-index="11" data-volume="0.22" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-13" class="clip" data-start="20.1" data-duration="1.32" data-track-index="11" data-volume="0.35" src="assets/sfx/ping.mp3"></audio>
      <audio id="sfx-14" class="clip" data-start="21.8" data-duration="0.57" data-track-index="11" data-volume="0.22" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-15" class="clip" data-start="22.5" data-duration="0.72" data-track-index="11" data-volume="0.45" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-16" class="clip" data-start="23.4" data-duration="0.57" data-track-index="11" data-volume="0.45" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-17" class="clip" data-start="24.4" data-duration="1.8" data-track-index="11" data-volume="0.45" src="assets/sfx/sparkle.mp3"></audio>
      <audio id="sfx-18" class="clip" data-start="25.5" data-duration="0.37" data-track-index="12" data-volume="0.45" src="assets/sfx/click.mp3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
