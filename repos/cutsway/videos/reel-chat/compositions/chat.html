  <script>
    (function () {
      // [id, appears at, kind]. Typing bubbles run from their time until the reply that follows them.
      const FLOW = [
        ["m1", 0.0], ["m2", 1.4], ["t1", 2.6], ["m3", 3.6], ["m4", 4.8], ["t2", 6.6], ["m5", 7.3], ["d1", 8.6], ["m6", 9.2],
        ["m7", 10.8], ["m8", 11.7], ["t3", 12.5], ["m9", 13.2], ["m10", 15.0], ["t4", 16.0], ["m11", 16.7], ["m12", 18.4],
        ["t5", 19.4], ["m13", 20.1], ["m14", 21.8],
      ];
      const VIEW_H = 840;
      const GAP = 22;
      // Lay the thread out once (before any tween): a typing bubble takes the slot its reply will fill.
      let y = 40;
      const top = {};
      FLOW.forEach(([id]) => {
        const el = document.getElementById(id);
        if (id[0] === "t") {
          top[id] = y;
          el.style.top = y + "px";
          return;
        }
        top[id] = y;
        el.style.top = y + "px";
        y += el.offsetHeight + GAP + (id === "d1" ? 10 : 0);
      });
      const bottom = (id) => top[id] + document.getElementById(id).offsetHeight;
      const heart = document.getElementById("ch-heart");
      heart.style.top = top.m14 + document.getElementById("m14").offsetHeight - 40 + "px";
      heart.style.right = "120px";

      const tl = gsap.timeline({ paused: true });
      let shift = 0;
      FLOW.forEach(([id, at], i) => {
        const el = "#" + id;
        // Scroll the thread when the newest item would fall below the fold.
        const need = Math.max(0, bottom(id) + 30 - VIEW_H);
        if (need > shift) {
          tl.fromTo("#ch-list", { y: -shift }, { y: -need, duration: 0.32, ease: "power3.out", immediateRender: false }, at);
          shift = need;
        }
        if (id[0] === "t") {
          const next = FLOW[i + 1][1];
          tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, at);
          tl.to(el, { opacity: 0, duration: 0.05, ease: "none" }, next - 0.02);
          // The status line says so too.
          tl.fromTo("#ch-on", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, at);
          tl.fromTo("#ch-ty", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, at);
          tl.fromTo("#ch-on", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, next);
          tl.fromTo("#ch-ty", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, next);
          // The dots bounce in turn while it types.
          const n = Math.floor((next - at) / 0.36);
          document.querySelectorAll(el + " b").forEach((dot, k) => {
            tl.fromTo(dot, { y: 0 }, { y: -14, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, at + 0.1 + k * 0.1);
          });
          return;
        }
        if (id === "d1") {
          tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, at);
          return;
        }
        if (at === 0) return; // the hook is on screen at frame 0
        tl.fromTo(el, { opacity: 0, scale: 0.7, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.7)" }, at);
      });

      // Upload, then the tick.
      tl.fromTo("#m4-bar", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 4.95);
      tl.fromTo("#m4-up", { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, 6.35);
      tl.fromTo("#m4-done", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 6.38);
      // The heart reaction.
      tl.fromTo("#ch-heart", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, 22.5);

      // The phone pulls back into the end card.
      tl.to("#ch-app", { scale: 0.5, y: -120, borderRadius: 90, filter: "blur(10px)", opacity: 0, duration: 0.6, ease: "power3.in" }, 23.4);
      tl.fromTo("#ch-turn", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 23.7);
      tl.fromTo("#ch-logo", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" }, 24.4);
      tl.fromTo("#ch-url", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 24.9);
      tl.fromTo("#ch-wa", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 25.2);
      tl.fromTo("#ch-btn", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 25.5);
      tl.to({}, { duration: 30 }, 0);
      window.__timelines["chat"] = tl;
    })();
  </script>
